name: gate

# Server-side wall. Local husky hooks are bypassable with --no-verify;
# this makes the gate unbypassable for anything that reaches GitHub.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan commits

      - name: Install gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the Dockerfile runtime
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Local commit-msg hooks are bypassable; check every commit the PR adds.
      - name: Commit messages (commitlint)
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # Includes the prod audit and the license allowlist (scripts/gate.sh).
      - name: Gate wall (pnpm gate)
        run: pnpm gate

      # E2E is deliberately out of `pnpm gate` (too slow per-commit); it runs
      # here on every PR and push to main so a broken handshake can't merge green.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright, multi-context round)
        run: pnpm e2e
